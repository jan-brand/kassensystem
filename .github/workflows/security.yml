name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan tracked text files for high-confidence secret patterns
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          patterns = {
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'(?:ghp_|github_pat_)[A-Za-z0-9_]{20,255}'),
              'Private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          hits = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              if path.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2','.ttf','.lock'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      hits.append((str(path), name))
          if hits:
              for path, kind in sorted(set(hits)):
                  print(f'{path}: {kind}')
              sys.exit(1)
          print('No high-confidence secret patterns detected.')
          PY
