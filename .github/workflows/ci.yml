name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, sodium
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: composer validate --no-check-publish
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan env:sync --yes
      - run: php artisan app:check
      - run: php artisan test
      - run: php vendor/bin/pint --test
      - run: php vendor/bin/phpstan analyse --no-progress
      - run: npm install
      - run: npm run build
