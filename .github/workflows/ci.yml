name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, fileinfo, sodium
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan env:sync --yes
      - run: composer qa:release
      - run: composer release:status
      - name: Verify Laravel optimize and route cache
        env:
          FOUNDATION_DASHBOARD: 'false'
        run: |
          php artisan optimize --no-ansi
          php artisan route:list --name=health --no-ansi
          php artisan optimize:clear --no-ansi
